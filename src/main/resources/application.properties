# spring.application.name=grouper
spring.application.name=${APP_NAME:Grouper}
# Database Connection
# spring.datasource.url=jdbc:mysql://localhost:3306/grouper?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=1234JCuer!

# Database Connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:grouper}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234JCuer!}

# Allows Flyway to execute the DELIMITER blocks correctly
spring.flyway.mixed=true
# Tell Flyway to be loud if it can't find the location
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# spring.jpa.show-sql=true

# Optional: Ensure Flyway is explicitly enabled
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Enable true batching at the database level
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

logging.level.org.flywaydb=DEBUG

ax.import.chunk-size=${AX_IMPORT_CHUNK_SIZE:500}

# Port (if you are still using 8081)
# server.port=8081
server.port=${PORT:8081}


# Dynamic Storage Path
# Defaulting to a 'storage' folder in the current working directory if not provided
app.upload.dir=${UPLOAD_PATH:D:/REPORTS}

grouper.csv.dir=${GROUPER_CSV_DIR:D:/REPORTS/grouperlibrary}