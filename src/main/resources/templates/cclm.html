<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCLM Library | Grouper</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/dynamicPage.css}" />
    <link rel="stylesheet" th:href="@{/css/jquery.dataTables.min.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="dashboard-body">
    <div th:replace="~{fragments :: header}"></div>

    <div class="main-wrapper">
      <div th:replace="~{fragments :: sidebar('cclm')}"></div>

      <main class="main-content">
        <div th:if="${message}" class="alert-banner" id="autoDismissAlert">
          <div class="alert-content">
            <i class="fa-solid fa-circle-info"></i>
            <span th:text="${message}"></span>
          </div>
          <button
            type="button"
            class="alert-close"
            onclick="this.parentElement.style.display = 'none'"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <header class="page-header">
          <div class="header-left">
            <h1>CCLM Registry</h1>
          </div>

          <div class="header-actions">
            <div class="search-container">
              <i class="fa fa-magnifying-glass"></i>
              <input
                type="text"
                id="globalSearch"
                placeholder="Search records..."
              />
            </div>
          </div>
        </header>
        <section class="table-container">
          <table
            id="cclmTable"
            class="display nowrap"
            style="inline-size: 100%"
          >
            <thead>
              <tr>
                <th>CCROW</th>
                <th>CCL</th>
              </tr>
            </thead>
            <tbody>
              <!-- Loaded dynamically via JavaScript AJAX -->
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- Local External Scripts -->
    <script th:src="@{/js/jquery-3.7.0.min.js}"></script>
    <script th:src="@{/js/jquery.dataTables.min.js}"></script>

    <!-- Application Scripts -->
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/cclm.js}"></script>
  </body>
</html>
