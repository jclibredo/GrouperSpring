<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I10vx Library | Grouper</title>

    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/dynamicPage.css}" />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="dashboard-body">
    <div th:replace="~{fragments :: header}"></div>

    <div class="main-wrapper">
      <div th:replace="~{fragments :: sidebar('i10vx')}"></div>

      <main class="main-content">
        <header class="page-header">
          <div class="header-left">
            <h1>ICD-10 (I10vx) Registry</h1>
          </div>

          <div class="header-actions">
            <div class="search-container">
              <i class="fa fa-magnifying-glass"></i>
              <input
                type="text"
                id="globalSearch"
                placeholder="Search ICD-10 records..."
              />
            </div>
          </div>
        </header>

        <section class="table-container">
          <table id="i10vxTable" class="display nowrap" style="width: 100%">
            <thead>
              <tr>
                <th>Code</th>
                <th>Valid Code</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data populated dynamically via AJAX in i10vx.js -->
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- External Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- Application Scripts -->
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/i10vx.js}"></script>
  </body>
</html>
