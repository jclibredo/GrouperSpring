services:
  grouper-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grouper-container
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - D:\REPORTS:/app/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped